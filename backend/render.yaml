services:
  - type: web
    name: market-insight-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: market-insight-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: MI_SOURCE
        value: live
      - key: MI_REGION
        value: RU
      - key: MI_CORS_ORIGINS
        value: https://market-insight-git-main-denis-ryabtsevs-projects.vercel.app
      - key: MI_API_TOKEN
        generateValue: true
      - key: MI_CLIENT_ID
        generateValue: true
      - key: MI_CLIENT_SECRET
        generateValue: true

databases:
  - name: market-insight-db
    databaseName: market_insight
    user: market_insight_user
    plan: free
