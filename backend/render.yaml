services:
  - type: web
    name: market-insight-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: market-insight-db
          property: connectionString
      - key: PORT
        value: 10000

databases:
  - name: market-insight-db
    databaseName: market_insight
    user: market_insight_user
    plan: free
