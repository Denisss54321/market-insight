services:
  - type: web
    name: market-insight-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: market-insight-db
          property: connectionString
      - key: PORT
        value: 10000
      - key: MI_SOURCE
        value: live
      - key: MI_REGION
        value: RU
      - key: MI_CORS_ORIGINS
        value: https://market-insight-git-main-denis-ryabtsevs-projects.vercel.app
      - key: MI_CLIENT_ID
        value: 3533
      - key: MI_CLIENT_SECRET
        value: aS0vCSNPCzWJlZChUvaiIZOobmWRdUsjgXbPgfCB
      - key: MI_STEAM_API_KEY
        value: EE4E2FA02AE3CD3BD95A11AF0D1E5775
      - key: MI_STEAM_REDIRECT_URI
        value: https://market-insight-backend-9qr7.onrender.com/auth/callback/steam
      - key: MI_FRONTEND_URL
        value: https://market-insight-git-main-denis-ryabtsevs-projects.vercel.app

databases:
  - name: market-insight-db
    databaseName: market_insight
    user: market_insight_user
    plan: free
